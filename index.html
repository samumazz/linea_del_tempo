<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cronologia Storica (1517 - 1648)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #161618;
      color: #f4f4f5;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #202022;
      border-bottom: 1px solid #323236;
      padding: 18px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 0.875rem;
      color: #a1a1aa;
    }

    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .zoom-btn {
      background: #2c2c30;
      border: 1px solid #3f3f46;
      color: #e4e4e7;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .zoom-btn:hover {
      background: #3f3f46;
      border-color: #52525b;
    }

    main {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
    }

    .timeline-card {
      background: #242426;
      border: 1px solid #343438;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .timeline-topbar {
      padding: 12px 20px;
      background: #1d1d1f;
      border-bottom: 1px solid #343438;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.85rem;
      color: #a1a1aa;
    }

    .legend {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      color: #d4d4d8;
      font-size: 0.8rem;
    }

    .legend-swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }

    .timeline-scroll {
      overflow-x: auto;
      overflow-y: hidden;
      width: 100%;
      padding: 24px 0 32px 0;
      cursor: grab;
      background-color: #242426;
    }

    .timeline-scroll:active {
      cursor: grabbing;
    }

    .timeline-canvas {
      position: relative;
      height: 530px;
      margin: 0 40px;
    }

    /* Griglia anni */
    .year-tick {
      position: absolute;
      top: 0;
      bottom: 0;
      border-left: 1px dashed #323236;
      pointer-events: none;
    }

    .year-tick.major {
      border-left: 1px solid #424248;
    }

    .year-label {
      position: absolute;
      top: 235px;
      transform: translateX(-50%);
      background: #2d2d30;
      color: #e4e4e7;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid #48484f;
      z-index: 5;
    }

    /* Asse centrale */
    .central-axis {
      position: absolute;
      left: 0;
      right: 0;
      top: 247px;
      height: 2px;
      background: #52525b;
      z-index: 2;
    }

    /* Barre Periodi e Governi (Proporzionali) */
    .period-bar {
      position: absolute;
      height: 36px;
      border-radius: 8px;
      padding: 0 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: #ffffff;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35);
      transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
      z-index: 4;
      overflow: hidden;
      white-space: nowrap;
      border: 1px solid rgba(255, 255, 255, 0.15);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
    }

    .period-bar:hover {
      transform: translateY(-2px);
      filter: brightness(1.12);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
      z-index: 10;
    }

    .period-title {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .period-years {
      font-size: 0.72rem;
      opacity: 0.92;
      font-weight: 500;
      flex-shrink: 0;
    }

    /* Eventi Puntuali (Sotto l'asse) */
    .event-marker {
      position: absolute;
      top: 248px;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      z-index: 4;
    }

    .event-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 3px solid #242426;
      margin-top: -6px;
      transition: transform 0.15s;
    }

    .event-marker:hover .event-dot {
      transform: scale(1.25);
    }

    .event-stem {
      width: 2px;
      background: #48484f;
    }

    .event-card {
      background: #2c2c30;
      border: 1px solid #3f3f46;
      border-left-width: 4px;
      border-radius: 6px;
      padding: 6px 10px;
      width: 158px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
      transition: transform 0.15s, background-color 0.15s;
    }

    .event-marker:hover .event-card {
      transform: translateY(2px);
      background: #35353a;
      z-index: 12;
    }

    .event-year {
      font-size: 0.72rem;
      font-weight: 700;
    }

    .event-name {
      font-size: 0.78rem;
      font-weight: 600;
      color: #f4f4f5;
      line-height: 1.25;
      margin-top: 2px;
    }

    /* Finestra Modale */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: #242426;
      border: 1px solid #3f3f46;
      border-radius: 12px;
      max-width: 520px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.6);
      animation: fadeIn 0.15s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .modal-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      color: #ffffff;
      margin-bottom: 6px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
    }

    .modal-close {
      background: #323236;
      border: 1px solid #48484f;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      color: #d4d4d8;
    }

    .modal-close:hover {
      background: #3f3f46;
      color: #ffffff;
    }

    .modal-body {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #d4d4d8;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Cronologia Storica (1517 - 1648)</h1>
      <p class="subtitle">Clicca su qualsiasi periodo o evento per visualizzare il dettaglio</p>
    </div>
    <div class="zoom-controls">
      <button class="zoom-btn" id="zoomOut">− Riduci</button>
      <button class="zoom-btn" id="zoomReset">100%</button>
      <button class="zoom-btn" id="zoomIn">+ Ingrandisci</button>
    </div>
  </header>

  <main>
    <div class="timeline-card">
      <div class="timeline-topbar">
        <span>Scorri orizzontalmente per esplorare gli anni dal 1517 al 1648</span>
        <div class="legend">
          <div class="legend-item">
            <span class="legend-swatch" style="background: #6c8453;"></span>
            <span>Impero / Germania</span>
          </div>
          <div class="legend-item">
            <span class="legend-swatch" style="background: #8a568e;"></span>
            <span>Chiesa / Concilio</span>
          </div>
          <div class="legend-item">
            <span class="legend-swatch" style="background: #a38348;"></span>
            <span>Spagna</span>
          </div>
          <div class="legend-item">
            <span class="legend-swatch" style="background: #28568f;"></span>
            <span>Inghilterra</span>
          </div>
          <div class="legend-item">
            <span class="legend-swatch" style="background: #9f494c;"></span>
            <span>Francia</span>
          </div>
        </div>
      </div>

      <div class="timeline-scroll" id="timelineScroll">
        <div class="timeline-canvas" id="timelineCanvas"></div>
      </div>
    </div>
  </main>

  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-header">
        <div>
          <span class="modal-badge" id="modalBadge"></span>
          <h3 class="modal-title" id="modalTitle"></h3>
        </div>
        <button class="modal-close" id="modalClose" aria-label="Chiudi">✕</button>
      </div>
      <p class="modal-body" id="modalDesc"></p>
    </div>
  </div>

  <script>
    const START_YEAR = 1515;
    const END_YEAR = 1650;
    let pixelsPerYear = 13;

    // Colori estratti dall'immagine di riferimento:
    // Verde oliva (Impero/Riforma): #6c8453
    // Viola (Concilio di Trento): #8a568e
    // Ocra/Oro (Spagna/Asburgo di Spagna): #a38348
    // Blu (Inghilterra): #28568f
    // Rosso corallo/bordeaux (Francia): #9f494c

    const periodi = [
      {
        titolo: "Regno di Carlo V d'Asburgo",
        inizio: 1519,
        fine: 1556,
        corsia: 0,
        colore: "#6c8453",
        descrizione: "Carlo V governa un impero vastissimo che comprende Spagna, Paesi Bassi, possedimenti italiani, Germania e colonie americane, affrontando la Riforma protestante e le guerre d'Italia fino all'abdicazione del 1556."
      },
      {
        titolo: "Regno di Filippo II",
        inizio: 1556,
        fine: 1598,
        corsia: 0,
        colore: "#a38348",
        descrizione: "Figlio di Carlo V, eredita la corona di Spagna e i domini coloniali e italiani. Difensore del cattolicesimo, affronta la rivolta dei Paesi Bassi, l'Impero Ottomano e l'Inghilterra."
      },
      {
        titolo: "Governo di Richelieu",
        inizio: 1624,
        fine: 1644,
        corsia: 0,
        colore: "#9f494c",
        descrizione: "Primo ministro di Luigi XIII dal 1624 (e influenza diretta fino al 1644). Rafforza l'assolutismo monarchico in Francia, riduce il potere politico degli ugonotti e interviene nella Guerra dei Trent'anni contro gli Asburgo."
      },
      {
        titolo: "Regno di Elisabetta I",
        inizio: 1558,
        fine: 1603,
        corsia: 1,
        colore: "#28568f",
        descrizione: "Consolida la Chiesa anglicana, promuove lo sviluppo marittimo e commerciale dell'Inghilterra e sconfigge l'Invincibile Armata spagnola nel 1588."
      },
      {
        titolo: "Guerra dei Trent'anni",
        inizio: 1618,
        fine: 1648,
        corsia: 1,
        colore: "#6c8453",
        descrizione: "Conflitto europeo iniziato come scontro religioso nell'Impero germanico e trasformatosi in guerra per l'egemonia continentale tra Asburgo e Francia, concluso con la Pace di Vestfalia."
      },
      {
        titolo: "Concilio di Trento",
        inizio: 1545,
        fine: 1563,
        corsia: 2,
        colore: "#8a568e",
        descrizione: "Concilio ecumenico convocato per rispondere alla Riforma protestante: definisce i dogmi cattolici e avvia la Controriforma."
      },
      {
        titolo: "Guerre di religione in Francia",
        inizio: 1562,
        fine: 1598,
        corsia: 2,
        colore: "#9f494c",
        descrizione: "Serie di otto conflitti civili tra cattolici e ugonotti (calvinisti francesi), culminati nella notte di San Bartolomeo e risolti con l'Editto di Nantes."
      },
      {
        titolo: "Governo del Conte-Duca di Olivares",
        inizio: 1621,
        fine: 1643,
        corsia: 2,
        colore: "#a38348",
        descrizione: "Valido di Filippo IV di Spagna, tenta di centralizzare l'impero spagnolo e sostenere lo sforzo bellico nella Guerra dei Trent'anni."
      }
    ];

    // Eventi puntuali sotto l'asse con colore abbinato all'area storica
    const eventi = [
      {
        anno: 1517,
        titolo: "95 Tesi di Lutero",
        livello: 0,
        colore: "#6c8453",
        descrizione: "Martin Lutero affigge a Wittenberg le 95 tesi contro la vendita delle indulgenze, dando inizio alla Riforma protestante."
      },
      {
        anno: 1527,
        titolo: "Sacco di Roma",
        livello: 1,
        colore: "#6c8453",
        descrizione: "I lanzichenecchi al servizio di Carlo V saccheggiano Roma, segnando un punto di svolta nelle guerre d'Italia."
      },
      {
        anno: 1555,
        titolo: "Pace di Augusta",
        livello: 0,
        colore: "#6c8453",
        descrizione: "Sancisce il principio 'cuius regio, eius religio' nell'Impero germanico tra principi cattolici e luterani."
      },
      {
        anno: 1571,
        titolo: "Battaglia di Lepanto",
        livello: 1,
        colore: "#a38348",
        descrizione: "La flotta della Lega Santa sconfigge la flotta dell'Impero Ottomano nel golfo di Patrasso."
      },
      {
        anno: 1588,
        titolo: "Invincibile Armata",
        livello: 0,
        colore: "#28568f",
        descrizione: "La flotta spagnola inviata da Filippo II contro l'Inghilterra di Elisabetta I viene sconfitta."
      },
      {
        anno: 1598,
        titolo: "Editto di Nantes",
        livello: 1,
        colore: "#9f494c",
        descrizione: "Enrico IV concede libertà di culto agli ugonotti in Francia, ponendo fine alle guerre di religione."
      },
      {
        anno: 1628,
        titolo: "Presa di La Rochelle",
        livello: 0,
        colore: "#9f494c",
        descrizione: "Richelieu espugna la principale piazzaforte ugonotta in Francia, eliminando l'autonomia politica dei protestanti."
      },
      {
        anno: 1648,
        titolo: "Pace di Vestfalia",
        livello: 1,
        colore: "#6c8453",
        descrizione: "Pone fine alla Guerra dei Trent'anni, ridisegna gli equilibri europei e sancisce la sovranità degli Stati nazionali."
      }
    ];

    const canvas = document.getElementById("timelineCanvas");
    const modalBackdrop = document.getElementById("modalBackdrop");
    const modalBadge = document.getElementById("modalBadge");
    const modalTitle = document.getElementById("modalTitle");
    const modalDesc = document.getElementById("modalDesc");
    const modalClose = document.getElementById("modalClose");

    function openModal(badgeText, badgeColor, title, description) {
      modalBadge.textContent = badgeText;
      modalBadge.style.backgroundColor = badgeColor;
      modalTitle.textContent = title;
      modalDesc.textContent = description;
      modalBackdrop.classList.add("open");
    }

    modalClose.addEventListener("click", () => modalBackdrop.classList.remove("open"));
    modalBackdrop.addEventListener("click", (e) => {
      if (e.target === modalBackdrop) modalBackdrop.classList.remove("open");
    });

    function renderTimeline() {
      canvas.innerHTML = "";
      const totalWidth = (END_YEAR - START_YEAR) * pixelsPerYear;
      canvas.style.width = totalWidth + "px";

      // Asse centrale
      const axis = document.createElement("div");
      axis.className = "central-axis";
      canvas.appendChild(axis);

      // Tacche anni
      for (let year = START_YEAR; year <= END_YEAR; year += 5) {
        const x = (year - START_YEAR) * pixelsPerYear;
        const isMajor = year % 10 === 0;

        const tick = document.createElement("div");
        tick.className = "year-tick" + (isMajor ? " major" : "");
        tick.style.left = x + "px";
        canvas.appendChild(tick);

        if (isMajor || pixelsPerYear >= 16) {
          const label = document.createElement("div");
          label.className = "year-label";
          label.style.left = x + "px";
          label.textContent = year;
          canvas.appendChild(label);
        }
      }

      // Periodi e Governi
      periodi.forEach((p) => {
        const left = (p.inizio - START_YEAR) * pixelsPerYear;
        const width = Math.max((p.fine - p.inizio) * pixelsPerYear, 28);
        const top = 30 + p.corsia * 52;
        const durata = p.fine - p.inizio;

        const bar = document.createElement("div");
        bar.className = "period-bar";
        bar.style.left = left + "px";
        bar.style.width = width + "px";
        bar.style.top = top + "px";
        bar.style.backgroundColor = p.colore;
        bar.title = `${p.titolo} (${p.inizio} - ${p.fine}, ${durata} anni)`;

        bar.innerHTML = `
          <span class="period-title">${p.titolo}</span>
          <span class="period-years">${p.inizio}–${p.fine}</span>
        `;

        bar.addEventListener("click", () => {
          openModal(
            `Periodo / Governo: ${p.inizio} – ${p.fine} (${durata} anni)`,
            p.colore,
            p.titolo,
            p.descrizione
          );
        });

        canvas.appendChild(bar);
      });

      // Eventi puntuali
      eventi.forEach((ev) => {
        const left = (ev.anno - START_YEAR) * pixelsPerYear;
        const stemHeight = ev.livello === 0 ? 28 : 114;

        const marker = document.createElement("div");
        marker.className = "event-marker";
        marker.style.left = left + "px";

        marker.innerHTML = `
          <div class="event-dot" style="background: ${ev.colore}; box-shadow: 0 0 0 2px ${ev.colore};"></div>
          <div class="event-stem" style="height: ${stemHeight}px;"></div>
          <div class="event-card" style="border-left-color: ${ev.colore};">
            <div class="event-year" style="color: ${ev.colore}; filter: brightness(1.35);">${ev.anno}</div>
            <div class="event-name">${ev.titolo}</div>
          </div>
        `;

        marker.addEventListener("click", () => {
          openModal(`Evento: ${ev.anno}`, ev.colore, ev.titolo, ev.descrizione);
        });

        canvas.appendChild(marker);
      });
    }

    document.getElementById("zoomIn").addEventListener("click", () => {
      pixelsPerYear = Math.min(26, pixelsPerYear + 3);
      renderTimeline();
    });

    document.getElementById("zoomOut").addEventListener("click", () => {
      pixelsPerYear = Math.max(7, pixelsPerYear - 3);
      renderTimeline();
    });

    document.getElementById("zoomReset").addEventListener("click", () => {
      pixelsPerYear = 13;
      renderTimeline();
    });

    // Scorrimento con trascinamento mouse
    const scrollBox = document.getElementById("timelineScroll");
    let isDown = false;
    let startX;
    let scrollLeft;

    scrollBox.addEventListener("mousedown", (e) => {
      isDown = true;
      startX = e.pageX - scrollBox.offsetLeft;
      scrollLeft = scrollBox.scrollLeft;
    });
    scrollBox.addEventListener("mouseleave", () => (isDown = false));
    scrollBox.addEventListener("mouseup", () => (isDown = false));
    scrollBox.addEventListener("mousemove", (e) => {
      if (!isDown) return;
      e.preventDefault();
      const x = e.pageX - scrollBox.offsetLeft;
      const walk = (x - startX) * 1.5;
      scrollBox.scrollLeft = scrollLeft - walk;
    });

    renderTimeline();
  </script>
</body>
</html>
