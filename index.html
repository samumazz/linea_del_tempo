<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cronologia Storica (1515 - 1680)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #161618;
      color: #f4f4f5;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #202022;
      border-bottom: 1px solid #323236;
      padding: 18px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 0.875rem;
      color: #a1a1aa;
    }

    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .zoom-btn {
      background: #2c2c30;
      border: 1px solid #3f3f46;
      color: #e4e4e7;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .zoom-btn:hover {
      background: #3f3f46;
      border-color: #52525b;
    }

    main {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
    }

    .timeline-card {
      background: #242426;
      border: 1px solid #343438;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .timeline-topbar {
      padding: 12px 20px;
      background: #1d1d1f;
      border-bottom: 1px solid #343438;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.85rem;
      color: #a1a1aa;
    }

    .legend {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      color: #d4d4d8;
      font-size: 0.8rem;
    }

    .legend-swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }

    .timeline-scroll {
      overflow-x: auto;
      overflow-y: hidden;
      width: 100%;
      padding: 24px 0 32px 0;
      cursor: grab;
      background-color: #242426;
    }

    .timeline-scroll:active {
      cursor: grabbing;
    }

    .timeline-canvas {
      position: relative;
      height: 640px;
      margin: 0 40px;
    }

    /* Separatori visivi tra nazioni */
    .nation-lane-bg {
      position: absolute;
      left: 0;
      right: 0;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.06);
      pointer-events: none;
    }

    /* Griglia anni */
    .year-tick {
      position: absolute;
      top: 0;
      bottom: 0;
      border-left: 1px dashed #323236;
      pointer-events: none;
    }

    .year-tick.major {
      border-left: 1px solid #424248;
    }

    .year-label {
      position: absolute;
      top: 325px;
      transform: translateX(-50%);
      background: #2d2d30;
      color: #e4e4e7;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid #48484f;
      z-index: 5;
    }

    /* Asse centrale */
    .central-axis {
      position: absolute;
      left: 0;
      right: 0;
      top: 337px;
      height: 2px;
      background: #52525b;
      z-index: 2;
    }

    /* Barre Periodi e Governi */
    .period-bar {
      position: absolute;
      height: 28px;
      border-radius: 6px;
      padding: 0 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35);
      transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
      z-index: 4;
      overflow: hidden;
      white-space: nowrap;
      border: 1px solid rgba(255, 255, 255, 0.15);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
    }

    .period-bar:hover {
      transform: translateY(-2px);
      filter: brightness(1.12);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
      z-index: 10;
    }

    .period-title {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .period-years {
      font-size: 0.68rem;
      opacity: 0.92;
      font-weight: 500;
      flex-shrink: 0;
    }

    /* Eventi Puntuali (Sotto l'asse) */
    .event-marker {
      position: absolute;
      top: 338px;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      z-index: 4;
    }

    .event-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 3px solid #242426;
      margin-top: -6px;
      transition: transform 0.15s;
    }

    .event-marker:hover .event-dot {
      transform: scale(1.25);
    }

    .event-stem {
      width: 2px;
      background: #48484f;
    }

    .event-card {
      background: #2c2c30;
      border: 1px solid #3f3f46;
      border-left-width: 4px;
      border-radius: 6px;
      padding: 6px 9px;
      width: 155px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
      transition: transform 0.15s, background-color 0.15s;
    }

    .event-marker:hover .event-card {
      transform: translateY(2px);
      background: #35353a;
      z-index: 12;
    }

    .event-year {
      font-size: 0.72rem;
      font-weight: 700;
    }

    .event-name {
      font-size: 0.76rem;
      font-weight: 600;
      color: #f4f4f5;
      line-height: 1.25;
      margin-top: 2px;
    }

    /* Finestra Modale */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: #242426;
      border: 1px solid #3f3f46;
      border-radius: 12px;
      max-width: 520px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.6);
      animation: fadeIn 0.15s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .modal-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      color: #ffffff;
      margin-bottom: 6px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
    }

    .modal-close {
      background: #323236;
      border: 1px solid #48484f;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      color: #d4d4d8;
    }

    .modal-close:hover {
      background: #3f3f46;
      color: #ffffff;
    }

    .modal-body {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #d4d4d8;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Cronologia Storica (1515 - 1680)</h1>
      <p class="subtitle">Clicca su qualsiasi periodo o evento per visualizzare la descrizione</p>
    </div>
    <div class="zoom-controls">
      <button class="zoom-btn" id="zoomOut">− Riduci</button>
      <button class="zoom-btn" id="zoomReset">100%</button>
      <button class="zoom-btn" id="zoomIn">+ Ingrandisci</button>
    </div>
  </header>

  <main>
    <div class="timeline-card">
      <div class="timeline-topbar">
        <span>Scorri orizzontalmente per esplorare gli anni dal 1515 al 1680</span>
        <div class="legend">
          <div class="legend-item">
            <span class="legend-swatch" style="background: #6c8453;"></span>
            <span>Impero/Germania</span>
          </div>
          <div class="legend-item">
            <span class="legend-swatch" style="background: #8a568e;"></span>
            <span>Stato della Chiesa</span>
          </div>
          <div class="legend-item">
            <span class="legend-swatch" style="background: #a38348;"></span>
            <span>Spagna</span>
          </div>
          <div class="legend-item">
            <span class="legend-swatch" style="background: #28568f;"></span>
            <span>Inghilterra</span>
          </div>
          <div class="legend-item">
            <span class="legend-swatch" style="background: #9f494c;"></span>
            <span>Francia</span>
          </div>
        </div>
      </div>

      <div class="timeline-scroll" id="timelineScroll">
        <div class="timeline-canvas" id="timelineCanvas"></div>
      </div>
    </div>
  </main>

  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-header">
        <div>
          <span class="modal-badge" id="modalBadge"></span>
          <h3 class="modal-title" id="modalTitle"></h3>
        </div>
        <button class="modal-close" id="modalClose" aria-label="Chiudi">✕</button>
      </div>
      <p class="modal-body" id="modalDesc"></p>
    </div>
  </div>

  <script>
    const START_YEAR = 1515;
    const END_YEAR = 1680;
    let pixelsPerYear = 13;

    // Periodi raggruppati per nazione/area in corsie esclusive (zero sovrapposizioni)
    const periodi = [
      // --- AREA 1: IMPERO / GERMANIA (Corsie 0 e 1) ---
      {
        titolo: "Riforma luterana",
        inizio: 1517,
        fine: 1521,
        corsia: 0,
        colore: "#6c8453",
        descrizione: "Avvio della frattura religiosa in Germania con le tesi di Martin Lutero fino alla Dieta di Worms e alla sua scomunica."
      },
      {
        titolo: "Epoca della confessionalizzazione e tensioni nell'Impero",
        inizio: 1555,
        fine: 1618,
        corsia: 0,
        colore: "#6c8453",
        descrizione: "Periodo compreso tra la Pace di Augusta e lo scoppio della Guerra dei Trent'anni, caratterizzato dalla definizione delle confessioni religiose e crescenti tensioni politiche nell'Impero."
      },
      {
        titolo: "Impero di Carlo V",
        inizio: 1519,
        fine: 1556,
        corsia: 1,
        colore: "#6c8453",
        descrizione: "Regno di Carlo V d'Asburgo su un vasto impero europeo e coloniale, segnato dalla Riforma protestante e dalle guerre contro Francia e Ottomani."
      },
      {
        titolo: "Guerra dei Trent'anni",
        inizio: 1618,
        fine: 1648,
        corsia: 1,
        colore: "#6c8453",
        descrizione: "Conflitto europeo iniziato come scontro religioso nell'Impero germanico e trasformatosi in guerra per l'egemonia continentale fino alla Pace di Vestfalia."
      },

      // --- AREA 2: CHIESA / CONCILIO (Corsia 2) ---
      {
        titolo: "Concilio di Trento e Controriforma",
        inizio: 1545,
        fine: 1563,
        corsia: 2,
        colore: "#8a568e",
        descrizione: "Concilio ecumenico convocato dalla Chiesa cattolica per riaffermare i dogmi tradizionali e riorganizzare la disciplina ecclesiastica in risposta al protestantesimo."
      },

      // --- AREA 3: SPAGNA / PAESI BASSI (Corsie 3 e 4) ---
      {
        titolo: "Regno di Filippo II",
        inizio: 1556,
        fine: 1598,
        corsia: 3,
        colore: "#a38348",
        descrizione: "Governo del sovrano spagnolo, difensore dell'ortodossia cattolica, impegnato contro l'Impero Ottomano, i ribelli dei Paesi Bassi e l'Inghilterra."
      },
      {
        titolo: "Rivolta dei Paesi Bassi",
        inizio: 1566,
        fine: 1581,
        corsia: 4,
        colore: "#a38348",
        descrizione: "Insurrezione delle province dei Paesi Bassi contro il dominio e la pressione fiscale e religiosa di Filippo II di Spagna, culminata nella dichiarazione d'indipendenza."
      },

      // --- AREA 4: INGHILTERRA (Corsia 5 - sequenza continua senza sovrapposizioni) ---
      {
        titolo: "Fase della Riforma e regno dei Tudor",
        inizio: 1534,
        fine: 1558,
        corsia: 5,
        colore: "#28568f",
        descrizione: "Periodo che va dallo scisma anglicano di Enrico VIII ai brevi regni di Edoardo VI e Maria I la Cattolica, segnato da profondi mutamenti religiosi in Inghilterra."
      },
      {
        titolo: "Epoca elisabettiana",
        inizio: 1558,
        fine: 1603,
        corsia: 5,
        colore: "#28568f",
        descrizione: "Regno di Elisabetta I, caratterizzato dal consolidamento dell'anglicanesimo, dalla fioritura culturale ed economica e dall'ascesa marittima dell'Inghilterra."
      },

      // --- AREA 5: FRANCIA (Corsia 6 - sequenza continua senza sovrapposizioni) ---
      {
        titolo: "Guerre di religione in Francia",
        inizio: 1562,
        fine: 1598,
        corsia: 6,
        colore: "#9f494c",
        descrizione: "Conflitti civili tra cattolici e ugonotti (calvinisti francesi) che sconvolsero la Francia fino alla promulgazione dell'Editto di Nantes."
      },
      {
        titolo: "Regno di Enrico IV",
        inizio: 1598,
        fine: 1610,
        corsia: 6,
        colore: "#9f494c",
        descrizione: "Primo sovrano della dinastia dei Borbone: pacifica il regno dopo le guerre di religione e avvia la ricostruzione economica della Francia."
      },
      {
        titolo: "Regno di Maria de' Medici e successivamente di Luigi XIII",
        inizio: 1610,
        fine: 1624,
        corsia: 6,
        colore: "#9f494c",
        descrizione: "Periodo della reggenza di Maria de' Medici e dei primi anni di governo personale di Luigi XIII, segnato da instabilità interna prima dell'ascesa di Richelieu."
      },
      {
        titolo: "Governo di Richelieu e assolutismo",
        inizio: 1624,
        fine: 1642,
        corsia: 6,
        colore: "#9f494c",
        descrizione: "Azione politica del cardinale Richelieu come primo ministro di Luigi XIII volta a rafforzare il potere assoluto della monarchia francese e ridimensionare gli Asburgo."
      }
    ];

    // Tutti gli 8 eventi puntuali presenti nella foto di riferimento
    const eventi = [
      {
        anno: 1517,
        dataEtichetta: "1517-10-31",
        titolo: "Martin Lutero affige le 95 tesi",
        livello: 0,
        colore: "#6c8453",
        descrizione: "Il 31 ottobre 1517 Martin Lutero rende note a Wittenberg le 95 tesi contro la vendita delle indulgenze, dando inizio alla Riforma protestante."
      },
      {
        anno: 1534,
        dataEtichetta: "1534",
        titolo: "Atto di Supremazia di Enrico VIII",
        livello: 1,
        colore: "#28568f",
        descrizione: "Il Parlamento inglese riconosce re Enrico VIII come Capo Supremo della Chiesa d'Inghilterra, sancendo lo scisma da Roma."
      },
      {
        anno: 1555,
        dataEtichetta: "1555",
        titolo: "Pace di Augusta",
        livello: 0,
        colore: "#6c8453",
        descrizione: "Accordo firmato nell'Impero germanico che stabilisce il principio 'cuius regio, eius religio' tra principi cattolici e luterani."
      },
      {
        anno: 1571,
        dataEtichetta: "1571-10-07",
        titolo: "Battaglia di Lepanto",
        livello: 1,
        colore: "#a38348",
        descrizione: "Il 7 ottobre 1571 la flotta cristiana della Lega Santa, guidata dalla Spagna, sconfigge la flotta dell'Impero Ottomano."
      },
      {
        anno: 1572,
        dataEtichetta: "1572",
        titolo: "Strage di san Bartolomeo",
        livello: 2,
        colore: "#9f494c",
        descrizione: "Massacro degli ugonotti a Parigi e in altre città francesi durante le guerre di religione."
      },
      {
        anno: 1588,
        dataEtichetta: "1588",
        titolo: "Sconfitta dell'Invincibile Armata",
        livello: 0,
        colore: "#28568f",
        descrizione: "La grande flotta spagnola inviata da Filippo II per invadere l'Inghilterra viene sconfitta dalla marina inglese di Elisabetta I."
      },
      {
        anno: 1598,
        dataEtichetta: "1598",
        titolo: "Editto di Nantes",
        livello: 1,
        colore: "#9f494c",
        descrizione: "Decreto emanato da Enrico IV che concede libertà di culto e garanzie politiche agli ugonotti, chiudendo le guerre di religione in Francia."
      },
      {
        anno: 1648,
        dataEtichetta: "1648",
        titolo: "Pace di Vestfalia",
        livello: 2,
        colore: "#6c8453",
        descrizione: "Insieme di trattati che pongono fine alla Guerra dei Trent'anni e ridisegnano gli equilibri politici e religiosi europei."
      }
    ];

    const canvas = document.getElementById("timelineCanvas");
    const modalBackdrop = document.getElementById("modalBackdrop");
    const modalBadge = document.getElementById("modalBadge");
    const modalTitle = document.getElementById("modalTitle");
    const modalDesc = document.getElementById("modalDesc");
    const modalClose = document.getElementById("modalClose");

    function openModal(badgeText, badgeColor, title, description) {
      modalBadge.textContent = badgeText;
      modalBadge.style.backgroundColor = badgeColor;
      modalTitle.textContent = title;
      modalDesc.textContent = description;
      modalBackdrop.classList.add("open");
    }

    modalClose.addEventListener("click", () => modalBackdrop.classList.remove("open"));
    modalBackdrop.addEventListener("click", (e) => {
      if (e.target === modalBackdrop) modalBackdrop.classList.remove("open");
    });

    function renderTimeline() {
      canvas.innerHTML = "";
      const totalWidth = (END_YEAR - START_YEAR) * pixelsPerYear;
      canvas.style.width = totalWidth + "px";

      // Linee sottili di separazione tra le fasce delle nazioni (dopo corsia 1, 2, 4, 5)
      const groupDividers = [1, 2, 4, 5];
      groupDividers.forEach((laneIdx) => {
        const divider = document.createElement("div");
        divider.className = "nation-lane-bg";
        divider.style.top = (14 + laneIdx * 42 + 34) + "px";
        canvas.appendChild(divider);
      });

      // Asse centrale
      const axis = document.createElement("div");
      axis.className = "central-axis";
      canvas.appendChild(axis);

      // Tacche anni (ogni 5 anni, etichetta ogni 10)
      for (let year = START_YEAR; year <= END_YEAR; year += 5) {
        const x = (year - START_YEAR) * pixelsPerYear;
        const isMajor = year % 10 === 0;

        const tick = document.createElement("div");
        tick.className = "year-tick" + (isMajor ? " major" : "");
        tick.style.left = x + "px";
        canvas.appendChild(tick);

        if (isMajor || pixelsPerYear >= 18) {
          const label = document.createElement("div");
          label.className = "year-label";
          label.style.left = x + "px";
          label.textContent = year;
          canvas.appendChild(label);
        }
      }

      // Periodi (sopra l'asse)
      periodi.forEach((p) => {
        const left = (p.inizio - START_YEAR) * pixelsPerYear;
        const width = Math.max((p.fine - p.inizio) * pixelsPerYear, 36);
        const top = 14 + p.corsia * 42;

        const bar = document.createElement("div");
        bar.className = "period-bar";
        bar.style.left = left + "px";
        bar.style.width = width + "px";
        bar.style.top = top + "px";
        bar.style.backgroundColor = p.colore;
        bar.title = `${p.inizio} / ${p.fine} — ${p.titolo}`;

        bar.innerHTML = `
          <span class="period-title">${p.titolo}</span>
          <span class="period-years">${p.inizio} / ${p.fine}</span>
        `;

        bar.addEventListener("click", () => {
          openModal(
            `${p.inizio} / ${p.fine}`,
            p.colore,
            p.titolo,
            p.descrizione
          );
        });

        canvas.appendChild(bar);
      });

      // Eventi puntuali (sotto l'asse)
      eventi.forEach((ev) => {
        const left = (ev.anno - START_YEAR) * pixelsPerYear;
        const stemHeights = [24, 92, 160];
        const stemHeight = stemHeights[ev.livello] || 24;

        const marker = document.createElement("div");
        marker.className = "event-marker";
        marker.style.left = left + "px";

        marker.innerHTML = `
          <div class="event-dot" style="background: ${ev.colore}; box-shadow: 0 0 0 2px ${ev.colore};"></div>
          <div class="event-stem" style="height: ${stemHeight}px;"></div>
          <div class="event-card" style="border-left-color: ${ev.colore};">
            <div class="event-year" style="color: ${ev.colore}; filter: brightness(1.35);">${ev.dataEtichetta}</div>
            <div class="event-name">${ev.titolo}</div>
          </div>
        `;

        marker.addEventListener("click", () => {
          openModal(ev.dataEtichetta, ev.colore, ev.titolo, ev.descrizione);
        });

        canvas.appendChild(marker);
      });
    }

    document.getElementById("zoomIn").addEventListener("click", () => {
      pixelsPerYear = Math.min(28, pixelsPerYear + 3);
      renderTimeline();
    });

    document.getElementById("zoomOut").addEventListener("click", () => {
      pixelsPerYear = Math.max(8, pixelsPerYear - 3);
      renderTimeline();
    });

    document.getElementById("zoomReset").addEventListener("click", () => {
      pixelsPerYear = 13;
      renderTimeline();
    });

    // Scorrimento con trascinamento mouse
    const scrollBox = document.getElementById("timelineScroll");
    let isDown = false;
    let startX;
    let scrollLeft;

    scrollBox.addEventListener("mousedown", (e) => {
      isDown = true;
      startX = e.pageX - scrollBox.offsetLeft;
      scrollLeft = scrollBox.scrollLeft;
    });
    scrollBox.addEventListener("mouseleave", () => (isDown = false));
    scrollBox.addEventListener("mouseup", () => (isDown = false));
    scrollBox.addEventListener("mousemove", (e) => {
      if (!isDown) return;
      e.preventDefault();
      const x = e.pageX - scrollBox.offsetLeft;
      const walk = (x - startX) * 1.5;
      scrollBox.scrollLeft = scrollLeft - walk;
    });

    renderTimeline();
  </script>
</body>
</html>
